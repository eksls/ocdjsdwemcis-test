<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/ui-mode.js?v=20261028d"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정타 딜러 계산기</title>
<link rel="stylesheet" href="css/dealer.css?v=20261028d">
</head>
<body>

<h1>정타 딜러 계산기</h1>

<div class="ds-card">
  <h2>버텨야 하는 공격</h2>
  <div class="ds-grid three">
    <label class="ds-field"><span>방식</span>
      <select id="hitMode">
        <option value="hit">정타 n대</option>
        <option value="guard">정타 n대 + 방어 m회</option>
      </select>
    </label>
    <label class="ds-field"><span>정타 (대)</span><input type="number" id="hits" min="0" max="99" value="4" inputmode="numeric"></label>
    <label class="ds-field" id="guardField"><span>방어 (회)</span><input type="number" id="guards" min="0" max="99" value="1" inputmode="numeric"></label>
    <label class="ds-field"><span>보스 공격력</span><input type="number" id="bossAtk" min="1" value="2750" inputmode="numeric"></label>
  </div>
  <p class="ds-note">맞고 나서 체력이 1 이상 남으면 생존입니다. 정타 1대 = 44×보스공격 ÷ (방어+22), 방어 1회 = 44×보스공격 ÷ (방어×3+22) (소수점 버림)</p>
</div>

<div class="ds-card">
  <h2>정령</h2>
  <label class="ds-field" style="margin-bottom:10px"><span>정령 정하기</span>
    <select id="spiritMode">
      <option value="manual">직접 입력</option>
      <option value="allAtk">최적화 · 올공퍼 (공% 4개, 부가옵만 고름)</option>
      <option value="allPct">최적화 · 올퍼 (%%%% 형태 전부)</option>
      <option value="noMakple">최적화 · 막플 제외 (%%%+ 빼고 전부)</option>
    </select>
  </label>
  <p class="ds-note ds-hide" id="spiritModeNote" style="margin:0"></p>
  <div id="spiritManual">
  <div class="ds-spirit" id="spiritSlots"></div>
  <div class="ds-grid" style="margin-top:10px">
    <label class="ds-field"><span>부가옵</span>
      <select id="spiritBonus">
        <option value="없음">없음</option><option value="체">체 +40</option><option value="공">공 +10</option><option value="방">방 +10</option>
      </select>
    </label>
    <label class="ds-field"><span>용/정령 탭에서 불러오기</span>
      <select id="spiritImport"><option value="">선택</option></select>
    </label>
  </div>
  </div>
</div>

<div class="ds-card">
  <h2>장비</h2>
  <div class="ds-grid three">
    <label class="ds-field"><span>팬던트</span>
      <select id="pendantKind"><option value="달">달</option><option value="태양">태양</option></select>
    </label>
    <label class="ds-field"><span>젬 수치</span>
      <select id="gemValue"></select>
    </label>
    <label class="ds-field"><span>등급</span>
      <select id="grade"><option value="9.0">9.0</option><option value="8.0">8.0</option><option value="7.0">7.0</option></select>
    </label>
    <label class="ds-field"><span>장신구 레벨</span>
      <select id="accMode">
        <option value="20">20</option>
        <option value="19">19</option>
        <option value="18">18</option>
        <option value="17">17</option>
      </select>
    </label>
    <label class="ds-field"><span>표시 개수</span>
      <select id="limit"><option>10</option><option selected>20</option><option>50</option><option>100</option></select>
    </label>
  </div>
  <p class="ds-note" id="gemNote"></p>
  <p class="ds-note">장신구 종류(보주·뿔 12종)와 인챈트(+21%), 팬던트 옵션(달 12 또는 6+6, 태양 12+6 또는 6+6+6), 젬 5개 분배는 계산기가 전부 시험해서 고릅니다.</p>
</div>

<div class="ds-card">
  <h2>층 버프 (선택)</h2>
  <div class="ds-grid three">
    <label class="ds-field"><span class="s-hp">체력 %</span><input type="number" id="buffHp" min="0" value="0" inputmode="numeric"></label>
    <label class="ds-field"><span class="s-atk">공격 %</span><input type="number" id="buffAtk" min="0" value="0" inputmode="numeric"></label>
    <label class="ds-field"><span class="s-def">방어 %</span><input type="number" id="buffDef" min="0" value="0" inputmode="numeric"></label>
  </div>
</div>

<button type="button" id="calcButton">계산하기</button>

<div id="result"></div>

<script src="js/shared.js"></script>
<script src="js/spirit-grade.js?v=20261026"></script>
<script src="js/dealer-survive-engine.js?v=20261028c"></script>
<script src="js/dealer-survive.js?v=20261028c"></script>
</body>
</html>
