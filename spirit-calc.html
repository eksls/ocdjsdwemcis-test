<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
<script src="js/ui-mode.js?v=20261028d"></script>
  <title>비벨 계산기</title>
  <link rel="stylesheet" href="css/spirit-calc.css">
</head>
<body>

<h1>정령 계산기</h1>
<p class="k-sub">용 1마리의 정령·장비 조합을 비벨 순으로 보여줍니다.</p>

<section class="k-card">
  <div class="k-card-h"><h2>정령</h2>
    <div class="k-toggles">
      <label class="k-chip"><input type="checkbox" id="spiritDisabled"><span>직접 입력 안 함</span></label>
      <label class="k-chip"><input type="checkbox" id="spiritOptimize" disabled><span>정령 최적화</span></label>
    </div>
  </div>
  <div class="spirit-ui">
    <div class="k-slots">
        <div class="k-slot"><span>1번</span><div class="k-pair"><select class="spirit-stat" aria-label="1번 스탯"><option>체</option><option>공</option><option>방</option></select><select class="spirit-type" aria-label="1번 종류"><option>%</option><option>+</option></select></div></div>
        <div class="k-slot"><span>2번</span><div class="k-pair"><select class="spirit-stat" aria-label="2번 스탯"><option>체</option><option>공</option><option>방</option></select><select class="spirit-type" aria-label="2번 종류"><option>%</option><option>+</option></select></div></div>
        <div class="k-slot"><span>3번</span><div class="k-pair"><select class="spirit-stat" aria-label="3번 스탯"><option>체</option><option>공</option><option>방</option></select><select class="spirit-type" aria-label="3번 종류"><option>%</option><option>+</option></select></div></div>
        <div class="k-slot"><span>4번</span><div class="k-pair"><select class="spirit-stat" aria-label="4번 스탯"><option>체</option><option>공</option><option>방</option></select><select class="spirit-type" aria-label="4번 종류"><option>%</option><option>+</option></select></div></div>
    </div>
  </div>
  <div class="k-grid k-grid-3" style="margin-top:10px">
    <label class="k-field"><span>부가옵</span><select id="spirit-bonus"><option>체</option><option>공</option><option>방</option></select></label>
    <label class="k-field"><span>버프</span>
      <select id="buffMode">
        <option>최적화 (2벞)</option><option>1벞 최적화</option><option>체체</option><option>공공</option><option>방방</option><option>체방</option><option>체공</option><option>공방</option><option>체</option><option>공</option><option>방</option><option>버프 없음</option>
      </select>
    </label>
    <label class="k-field"><span>정렬</span>
      <select id="sortMode"><option value="vval">비벨 높은 순</option><option value="tarFixed">TAR 높은 순</option></select>
    </label>
  </div>
  <p class="k-note">"직접 입력 안 함"을 켜면 "정령 최적화"로 가장 좋은 정령을 찾을 수 있습니다.</p>
</section>

<section class="k-card">
  <div class="k-card-h"><h2>용 · 장비</h2></div>
  <div class="k-grid k-grid-5">
    <label class="k-field"><span>용 타입</span>
      <select class="dragon-type"><option>전체</option><option>체</option><option>공</option><option>방</option><option>체공</option><option>체방</option><option>공방</option></select>
    </label>
    <label class="k-field"><span>용 스탯</span>
      <select class="dragon-stat"><option value="10">10.0</option><option value="9" selected>9.0</option><option value="8">8.0</option><option value="7">7.0</option></select>
    </label>
    <label class="k-field"><span>젬</span>
      <select class="gem-select"><option value="44">44</option><option value="42">42</option><option value="40">40</option><option value="39">39</option><option value="38">38</option><option value="37" selected>37</option><option value="36">36</option></select>
    </label>
    <label class="k-field"><span>장신구</span>
      <select class="accessory-select"><option>20%</option><option selected>19%</option><option>18%</option></select>
    </label>
    <label class="k-field"><span>팬던트</span>
      <select class="pendant-select"><option>없음</option><option selected>달</option><option>태양</option></select>
    </label>
  </div>

  <div class="k-sub-h">
    <label class="k-chip"><input type="checkbox" id="customPendantEnabled"><span>커스텀 팬던트</span></label>
    <button type="button" id="btnAddPendant" class="k-btn-sm" onclick="addPendant()" disabled>+ 팬던트 추가</button>
  </div>
  <div class="custom-pendant-container" id="pendantContainer"></div>

  <div class="k-sub-h"><b>스탯 최솟값</b><small>이보다 낮은 조합은 빼고 보여줌</small></div>
  <div class="k-grid k-grid-3">
    <label class="k-field"><span class="s-hp">체력</span><input type="number" id="minHP" placeholder="0" inputmode="numeric"></label>
    <label class="k-field"><span class="s-atk">공격</span><input type="number" id="minATK" placeholder="0" inputmode="numeric"></label>
    <label class="k-field"><span class="s-def">방어</span><input type="number" id="minDEF" placeholder="0" inputmode="numeric"></label>
  </div>
</section>

<section class="k-card">
  <div class="k-card-h"><h2>중복 제거</h2><small class="k-dim">켠 항목이 같은 결과는 가장 좋은 하나만</small></div>
  <div class="k-toggles">
    <label class="k-chip"><input type="checkbox" id="dedupeType"><span>타입</span></label>
    <label class="k-chip"><input type="checkbox" id="dedupeAccessory"><span>장신구</span></label>
    <label class="k-chip"><input type="checkbox" id="dedupeBuff"><span>버프</span></label>
    <label class="k-chip"><input type="checkbox" id="dedupePendant"><span>팬던트</span></label>
    <label class="k-chip"><input type="checkbox" id="dedupeSpirit"><span>정령</span></label>
  </div>
</section>

<button id="calcButton">계산하기</button>

<!-- 결과 -->
<div class="result-area">
  <div class="k-empty">계산하기를 누르면 결과가 여기에 나옵니다.</div>
</div>
<script src="js/spirit-grade.js?v=20261026"></script>
<script src="js/tar.js?v=20261026e"></script>
<script src="js/spirit-calc.js?v=20261028d"></script>

</body>
</html>
