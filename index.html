<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/ui-mode.js?v=20261028d"></script>
<title>길드전 계산기</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .tabs {
    display: flex;
    background: #222;
  }
  .tab {
    padding: 10px 16px;
    color: #ccc;
    cursor: pointer;
    border-right: 1px solid #444;
  }
  .tab.active {
    background: #fff;
    color: #000;
    font-weight: bold;
  }
  .data-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
  }
  .data-actions button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .data-actions button:hover { background: #444; color: #fff; }
  .data-actions button.danger { border-color: #844; color: #f99; }
  .data-actions button.danger:hover { background: #522; color: #fff; }
  #data-toast {
    position: fixed;
    top: 50px;
    right: 12px;
    background: #222;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 10;
  }
  #data-toast.show { opacity: 1; }
  iframe {
    width: 100%;
    height: calc(100vh - 42px);
    border: none;
  }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-src="result.html?v=20261028d">비벨 결과</div>
  <div class="tab" data-src="dragon.html?v=20261028d">용 / 정령</div>
  <div class="tab" data-src="gear.html?v=20261028d">장신구 / 팬던트 / 젬</div>
  <div class="tab" data-src="spirit-calc.html?v=20261028d">정령 계산기</div>
  <div class="tab" data-src="dealer-survive.html?v=20261028g">정타 딜러</div>
  <div class="tab" data-src="dealer-team.html?v=20261028g">정타 4마리</div>
  <div class="tab" data-src="pve.html?mode=tank&v=4">탱커 계산기</div>
  <div class="data-actions">
    <button type="button" id="data-save" title="용/정령, 장신구/팬던트/젬을 파일로 저장">저장하기</button>
    <button type="button" id="data-load" title="저장한 파일에서 용/정령, 장신구/팬던트/젬 불러오기">불러오기</button>
    <button type="button" id="data-reset" class="danger" title="입력한 데이터 전부 지우기">초기화</button>
    <input type="file" id="data-file" accept=".json,application/json" hidden>
  </div>
</div>

<script>
  // 제목, 가로 스크롤 탭 묶음, ⋯ 메뉴 버튼을 만듦
  if (window.GUILD_UI && window.GUILD_UI.mode === "v2") (function () {
    const bar = document.querySelector(".tabs");
    const brand = document.createElement("div");
    brand.className = "brand"; brand.textContent = "길드전 계산기";
    const strip = document.createElement("nav");
    strip.className = "tab-strip"; strip.setAttribute("aria-label", "계산기 메뉴");
    bar.querySelectorAll(".tab").forEach(t => strip.appendChild(t));
    const more = document.createElement("button");
    more.type = "button"; more.id = "more-btn"; more.className = "more-btn";
    more.setAttribute("aria-label", "저장/불러오기/초기화 메뉴"); more.setAttribute("aria-expanded", "false");
    more.textContent = "⋯";
    bar.prepend(brand, strip, more);
  })();
</script>
<iframe id="view" src="result.html?v=20261028d"></iframe>
<script>
  // 새 디자인: 탭 안 페이지를 내용 높이만큼 늘리고 안쪽 스크롤을 꺼서, 화면 전체가 한 번만 스크롤되게 함.
  // 같은 사이트의 페이지라 바깥에서 직접 높이를 잴 수 있으므로, 안쪽 페이지 스크립트가 늦거나 캐시돼도 동작함.
  if (window.GUILD_UI && window.GUILD_UI.mode === "v2") (function () {
    const iframe = document.getElementById("view");
    const bar = document.querySelector(".tabs");
    iframe.setAttribute("scrolling", "no");
    const barH = () => bar.getBoundingClientRect().height;
    const screenH = () => Math.max(320, window.innerHeight - barH());

    function measure() {
      const d = iframe.contentDocument;
      if (!d || !d.body) return 0;
      const w = d.defaultView;
      let max = 0;
      for (const el of d.body.children) {
        const cs = w.getComputedStyle(el);
        if (cs.display === "none" || cs.position === "fixed" || el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
        max = Math.max(max, el.getBoundingClientRect().bottom + (parseFloat(cs.marginBottom) || 0));
      }
      const bs = w.getComputedStyle(d.body);
      max += (parseFloat(bs.paddingBottom) || 0) + (parseFloat(bs.marginBottom) || 0);
      if (d.compatMode === "CSS1Compat") {
        max = Math.max(max, d.body.scrollHeight + (parseFloat(bs.marginTop) || 0) + (parseFloat(bs.marginBottom) || 0));
      }
      return Math.ceil(max + (w.scrollY || 0)) + 12; // 여유분: 안쪽 스크롤을 껐으므로 끝이 잘리지 않게
    }
    let last = 0;
    function fit() {
      const h = measure();
      if (h > 0 && Math.abs(h - last) > 1) { last = h; iframe.style.height = h + "px"; }
    }
    let ro = null, mo = null;
    function attach() {
      last = 0;
      iframe.style.height = screenH() + "px";
      fit();
      try {
        const d = iframe.contentDocument;
        if (ro) ro.disconnect();
        if (mo) mo.disconnect();
        if (window.ResizeObserver) { ro = new ResizeObserver(fit); ro.observe(d.body); }
        mo = new MutationObserver(() => requestAnimationFrame(fit));
        mo.observe(d.body, { childList: true, subtree: true, attributes: true, characterData: true });
        d.defaultView.addEventListener("load", fit);
        if (d.fonts && d.fonts.ready) d.fonts.ready.then(fit);
      } catch (e) {}
    }
    iframe.addEventListener("load", attach);
    if (iframe.contentDocument && iframe.contentDocument.readyState !== "loading" && iframe.contentDocument.body) attach();
    setInterval(fit, 800);
    window.addEventListener("resize", () => { last = 0; fit(); });

    // 탭 바꾸면 맨 위로, 선택한 탭이 보이게
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      iframe.style.height = screenH() + "px"; last = 0;
      window.scrollTo(0, 0);
      tab.scrollIntoView({ block: "nearest", inline: "center" });
    }));

    // 안쪽 페이지 요청: 계산 결과 위치로 스크롤
    window.addEventListener("message", (e) => {
      if (e.source !== iframe.contentWindow) return;
      const m = e.data || {};
      if (m.type === "guild-ui-height") fit();
      if (m.type === "guild-ui-scroll") {
        fit();
        requestAnimationFrame(() => {
          const top = iframe.getBoundingClientRect().top + window.scrollY + m.y - barH() - 8;
          window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        });
      }
    });

    // 휴대폰 ⋯ 메뉴 (저장/불러오기/초기화)
    const more = document.getElementById("more-btn");
    if (more) {
      more.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const open = bar.classList.toggle("menu-open");
        more.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", (ev) => {
        if (!bar.contains(ev.target)) { bar.classList.remove("menu-open"); more.setAttribute("aria-expanded", "false"); }
      });
      bar.querySelectorAll(".data-actions button").forEach(b => b.addEventListener("click", () => bar.classList.remove("menu-open")));
    }
  })();
</script>
<div id="data-toast"></div>

<script>
  const tabs = document.querySelectorAll(".tab");
  const iframe = document.getElementById("view");

  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      iframe.src = tab.dataset.src;
    };
  });

  // ===== 데이터 저장 / 불러오기 / 초기화 =====
  // 이 계산기가 쓰는 저장값만 다룸 (같은 주소의 다른 사이트 데이터는 건드리지 않음)
  // 초기화: 아래 접두어로 시작하는 전부 (비벨 결과, 딜러/탱커 계산기 포함)
  const DATA_PREFIXES = ["guild_", "dv1-"];
  // 저장하기/불러오기: 용 / 정령 / 장신구 / 팬던트 / 젬만
  const BACKUP_KEYS = ["guild_dragon_data", "guild_spirit_data", "guild_gear_data"];
  const BACKUP_TAG = "guild-calculator-backup";

  function isOurKey(k) {
    return DATA_PREFIXES.some(p => k.startsWith(p));
  }
  function ourKeys() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && isOurKey(k)) keys.push(k);
    }
    return keys;
  }
  function toast(msg) {
    const t = document.getElementById("data-toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function stamp() {
    const d = new Date(), z = n => String(n).padStart(2, "0");
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes());
  }
  // 현재 탭을 잠깐 비워서 입력 중이던 자동저장이 덮어쓰지 않게 한 뒤 작업하고 다시 띄움
  function withViewPaused(work) {
    const src = iframe.getAttribute("src");
    const resume = () => {
      iframe.removeEventListener("load", resume);
      try { work(); } finally { iframe.src = src; }
    };
    iframe.addEventListener("load", resume);
    iframe.src = "about:blank";
  }

  document.getElementById("data-save").onclick = () => {
    // 프리셋 이름 묻기: 비워 두면 지금처럼 저장 시간으로, 취소하면 저장 안 함
    const input = window.prompt("프리셋 이름을 입력하세요.\n비워 두면 저장 시간으로 저장합니다 (예: 길드전계산기-" + stamp() + ").", "");
    if (input === null) return;
    const name = input.trim().replace(/\.json$/i, "").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").slice(0, 80).trim();
    const fileName = (name || "길드전계산기-" + stamp()) + ".json";
    // 입력 직후 자동저장(0.3초 대기)이 끝나도록 잠깐 기다림
    setTimeout(() => {
      const keys = BACKUP_KEYS.filter(k => localStorage.getItem(k) !== null);
      if (!keys.length) { toast("저장할 데이터가 없습니다"); return; }
      const data = {};
      keys.forEach(k => { data[k] = localStorage.getItem(k); });
      const payload = { type: BACKUP_TAG, version: 1, name: name || null, savedAt: new Date().toISOString(), data };
      const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("저장 완료: " + fileName);
    }, 400);
  };

  const fileInput = document.getElementById("data-file");
  document.getElementById("data-load").onclick = () => { fileInput.value = ""; fileInput.click(); };
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let payload;
      try { payload = JSON.parse(reader.result); } catch (e) { payload = null; }
      if (!payload || payload.type !== BACKUP_TAG || !payload.data || typeof payload.data !== "object") {
        alert("이 계산기에서 저장한 파일이 아닙니다.");
        return;
      }
      const entries = Object.entries(payload.data).filter(([k, v]) => BACKUP_KEYS.includes(k) && typeof v === "string");
      if (!entries.length) { alert("파일에 불러올 데이터가 없습니다."); return; }
      const when = payload.savedAt ? new Date(payload.savedAt).toLocaleString() : "날짜 모름";
      const label = payload.name ? "\n프리셋 이름: " + payload.name : "";
      if (!confirm("지금 입력된 용/정령, 장신구/팬던트/젬을 이 파일 내용으로 바꿉니다." + label + "\n저장 시각: " + when + "\n계속할까요?")) return;
      withViewPaused(() => {
        BACKUP_KEYS.forEach(k => localStorage.removeItem(k));
        entries.forEach(([k, v]) => localStorage.setItem(k, v));
        toast("불러왔습니다");
      });
    };
    reader.readAsText(file);
  };

  document.getElementById("data-reset").onclick = () => {
    if (!confirm("비벨 결과, 용/정령, 장신구/팬던트/젬, 딜러/탱커 계산기까지 입력한 데이터를 전부 지웁니다.\n정말 초기화할까요?")) return;
    withViewPaused(() => {
      ourKeys().forEach(k => localStorage.removeItem(k));
      toast("초기화했습니다");
    });
  };
</script>

</body>
</html>
