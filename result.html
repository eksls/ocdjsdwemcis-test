<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/ui-mode.js?v=20261028d"></script>
<title>길드전 결과</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/result.css">
</head>
<body>

    <div id="loading-overlay">
    <div id="loading-text">최적 조합 계산 중... (0%)</div>
    <div class="progress-bar">
        <div id="loading-fill" class="progress-fill"></div>
    </div>
    <div style="font-size:14px; margin-top:10px; color:#ddd;">잠시만 기다려주세요.</div>
</div>

<h1 class="page-title">비벨 결과</h1>
<p class="k-sub">용/정령, 장비 탭에 넣은 것으로 길드전 3마리 최적 조합을 찾습니다.</p>

<section class="k-card" id="config-section">
  <div class="k-card-h"><h2>버프 · 너프</h2></div>
  <div class="k-bn">
    <div class="k-bn-row k-bn-head"><span></span><span>속성</span><span>스탯</span><span>타입</span><span>스탯</span></div>
    <div class="k-bn-row">
      <span class="k-tag buff">버프</span>
      <select id="buff-attr" aria-label="버프 속성"><option>선택</option><option>땅</option><option>물</option><option>불</option><option>바람</option><option>빛</option><option>어둠</option><option>여명</option><option>황혼</option><option>악몽</option></select>
      <select id="buff-stat1" class="k-stat" aria-label="버프 속성 스탯"><option value="선택">선택</option><option value="체">HP</option><option value="공">ATK</option><option value="방">DEF</option></select>
      <select id="buff-type" aria-label="버프 타입"><option>선택</option><option>체</option><option>공</option><option>방</option><option>체공</option><option>체방</option><option>공방</option></select>
      <select id="buff-stat2" class="k-stat" aria-label="버프 타입 스탯"><option value="선택">선택</option><option value="체">HP</option><option value="공">ATK</option><option value="방">DEF</option></select>
    </div>
    <div class="k-bn-row">
      <span class="k-tag nerf">너프</span>
      <select id="debuff-attr" aria-label="너프 속성"><option>선택</option><option>땅</option><option>물</option><option>불</option><option>바람</option><option>빛</option><option>어둠</option><option>여명</option><option>황혼</option><option>악몽</option></select>
      <select id="debuff-stat1" class="k-stat" aria-label="너프 속성 스탯"><option value="선택">선택</option><option value="체">HP</option><option value="공">ATK</option><option value="방">DEF</option></select>
      <select id="debuff-type" aria-label="너프 타입"><option>선택</option><option>체</option><option>공</option><option>방</option><option>체공</option><option>체방</option><option>공방</option></select>
      <select id="debuff-stat2" class="k-stat" aria-label="너프 타입 스탯"><option value="선택">선택</option><option value="체">HP</option><option value="공">ATK</option><option value="방">DEF</option></select>
    </div>
  </div>
</section>

<section class="k-card">
  <div class="k-card-h"><h2>예비 정령 · 정령 해제</h2></div>
  <div class="k-grid k-grid-6">
    <label class="k-field"><span>예비 정령</span>
      <select id="reserve-count"><option value="0">미사용</option><option value="1">1마리</option><option value="2">2마리</option><option value="3">전부</option></select>
    </label>
    <label class="k-field"><span>예비/해제 버프</span>
      <select id="reserve-buff-mode"><option value="2buff">2벞</option><option value="1buff">1벞</option><option value="both">전체</option></select>
    </label>
    <label class="k-field"><span>예비 속성/타입</span>
      <select id="reserve-type-mode"><option value="asis">그대로</option><option value="attrUnified">속성 통일</option><option value="typeUnified">타입 통일</option><option value="allUnified">전체 통일</option></select>
    </label>
    <label class="k-field"><span>정령 해제</span>
      <select id="spirit-unlock"><option value="off">미설정</option><option value="attrFixed">속성만 고정</option><option value="typeFixed">타입만 고정</option><option value="all">전체</option></select>
    </label>
    <label class="k-field"><span>최대 자원</span>
      <select id="max-resource"><option value="off">미사용</option><option value="preview">버프참고만</option><option value="result">결과만</option><option value="all">전체</option></select>
    </label>
    <label class="k-field"><span>자원 종류</span>
      <select id="max-resource-type"><option value="all">전체</option><option value="pen">팬던트</option><option value="acc">장신구</option><option value="gem">젬</option><option value="pen+acc">팬던트+장신구</option><option value="pen+gem">팬던트+젬</option><option value="acc+gem">장신구+젬</option></select>
    </label>
  </div>
</section>

<div class="calc-wrap">
  <button id="calc-btn">최적 조합 계산하기</button>
</div>

<h1 class="result-title">결과 (Top 3)</h1>
<div id="result-container">
  <div class="container result-card" id="result1">
    <h3>1순위</h3>
    <div class="vval-display">-</div>
  </div>
  <div class="container result-card" id="result2">
    <h3>2순위</h3>
    <div class="vval-display">-</div>
  </div>
  <div class="container result-card" id="result3">
    <h3>3순위</h3>
    <div class="vval-display">-</div>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/spirit-grade.js?v=20261026"></script>
<script src="js/exact-optimizer.js?v=20261026"></script>
<script src="js/result.js?v=20261028d"></script>
</body>
</html>
